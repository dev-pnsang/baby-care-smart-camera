name: baby_care_smart_cam
description: A sophisticated BabyCare SmartCam app with Neumorphism & Glassmorphism design
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  percent_indicator: ^4.2.3
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_vlc_player: ^7.4.2
  shared_preferences: ^2.2.2
  ffmpeg_kit_flutter_new_min_gpl: ^2.1.1
  path_provider: ^2.1.5
  tflite_flutter: ^0.10.4
  fftea: ^1.5.0
  audioplayers: ^6.4.0
  mqtt_client: ^10.3.0
  record: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  image: ^4.5.4

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/icons/
    - assets/images/
    - assets/emotion/
    - assets/audio/
  fonts:
    - family: SVN-GothamRounded
      fonts:
        - asset: assets/fonts/TTF/SVN-GothamRounded-Light.ttf
          weight: 300
        - asset: assets/fonts/TTF/SVN-GothamRounded-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/TTF/SVN-GothamRounded-Book.ttf
          weight: 400
        - asset: assets/fonts/TTF/SVN-GothamRounded-BookItalic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/TTF/SVN-GothamRounded-Medium.ttf
          weight: 500
        - asset: assets/fonts/TTF/SVN-GothamRounded-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/TTF/SVN-GothamRounded-Bold.ttf
          weight: 700
        - asset: assets/fonts/TTF/SVN-GothamRounded-BoldItalic.ttf
          weight: 700
          style: italic

